# Same as spack.yaml, plus the packages that are ONLY needed to build
# nukexc/tests. Use this env on a dev/login node when you want to run
# `ctest`; use the plain spack.yaml for production/library-only installs.
spack:
  include:
  - ../common/packages.yaml

  repos:
    nukexc: /Users/bobschreiner/NuKEXC/spack/repo
  concretizer:
    unify: true

  specs:
  - kokkos@4 +openmp ~cuda ~rocm ~sycl cxxstd=20
  - kokkos-kernels@4 +openmp +blas +lapack ^kokkos +openmp ~cuda ~rocm ~sycl ^openblas threads=openmp
  - arborx@2.1 +openmp ~cuda ~rocm ~sycl ^kokkos +openmp ~cuda ~rocm ~sycl
  - libxc@7.0.0
  - integratorxx@master
  # --- test-only, from here down ---
  - catch2@3
  - armadillo ^openblas threads=openmp
  - open-orbital-optimizer

  view: true
  packages:
    autoconf:
      buildable: true
    m4:
      buildable: true
